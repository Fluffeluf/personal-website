<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="media/Teddy_deco.png" type="image/png">
    <link href="styles/main.css" rel="stylesheet"/>
    <link href="styles/projekte.css" rel="stylesheet"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Projekte</title>
    <script>
        window.onload = function(){
            init_events();
            const carousel = document.getElementById("carousel");
            updateSlide();
        }

        function init_events(){
            document.getElementById('prev').addEventListener('click', previousAnzeigen);
            document.getElementById('next').addEventListener('click', nextAnzeigen);
        }

        let index = 0;
        const items = [
            {
                title: "Personal Website",
                text: "Eine personalisierte Webseite an der ich arbeite um mich besser vorstellen zu können und mich ebenfalls im Bereich der Webentwicklung weiterzuentwickeln.",
                image: "media/Teddy_deco.png",
                link: "index.html",
                linkText: "Zum Repository"
            },
            {
                title: "DreamyDew",
                text: "DreamyDew war mein Abschlussprojekt für das 1. Lehrjahr, es ist eine nette kleine Blogentry Seite, die ich mit HTML, CSS und PHP gezaubert habe. <br><br> Currently under Refactoring",
                image: "media/DreamyDewlogomittext.png",
                link: "../Zusammenfassend/DreamyDew/index.php",
                linkText: "Zu DreamyDew<br><a href='#'>Zum Repository</a>"
            },
            {
                title: "WPF TicketSystem",
                text: "Pair-Programming Projekt in C# das wir im 2. Lehrjahr momentan machen",
                image: "media/Verrueckte_Vogel.gif",
                link: "#",
                linkText: "Zum Repository"
            },
            {
                title: "WPF Buchverwaltungssytem aka BookBug",
                text: "Geplantes Freizeit Projekt, außerhalb der Schule deren erste Version mit C# und WPF entwickelt wird und gegebenenfalls dann auch in Java als Webapplikation.",
                image: "media/BookBug_logo.png",
                link: "#",
                linkText: "Zum Repository"
            }
        ];
        function updateSlide(){
            const item = items[index];
            carousel.innerHTML = `<div class='card'>
                <img src="${item.image}" alt="${item.title}">
                <h2>${item.title}</h2>
                <p>${item.text}</p>
                <a href="${item.link}">${item.linkText}</a>
                </div>`;
        }

        function previousAnzeigen(){
            if (index === 0) {
                index = items.length - 1;
            } else {
                index = index - 1;
            }

            updateSlide();
        }
        function nextAnzeigen(){
            if (index === items.length - 1) {
                index = 0;
            } else {
                index = index + 1;
            }

            updateSlide();
        }
    </script>
</head>
<body>
    <div class="jumbotron-custom"></div>
    <nav class="navbar-custom">
        <div class="container-fluid">
            <ul class="navbar-ul">
                <li>
                    <a class="home" href="index.html"></a>
                </li>
                <li>
                    <a class="lebenslauf" href="lebenslauf.html"></a>
                </li>
                <li>
                    <a class="zeugnis" href="zeugnis.html"></a>
                </li>
                <li>
                    <a class="projekte" href="#"></a>
                </li>
            </ul>
        </div>
    </nav>
    <div class="carouselWrapper">
        <div class="carousel" id="carousel">
            Hallo
        </div>
        <div class="btnContainer">
            <button class="carouselBtn" id="prev">Previous</button>
            <button class="carouselBtn" id="next">Next</button>
        </div>
    </div>
</body>
</html>
